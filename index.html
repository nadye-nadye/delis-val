<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delis Val | Cumbia Dream Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            spotify: '#1DB954',
                            youtube: '#FF0000',
                            instagram: '#E1306C',
                            tiktok: '#00F2FE', /* Using a bright cyan for dark mode contrast */
                            chartmetric: '#3B82F6'
                        }
                    },
                    animation: {
                        blob: "blob 7s infinite",
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS for Liquid Glass Aesthetic -->
    <style>
        body {
            background-color: #020617; /* Deep Slate Base */
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Core Glassmorphism utility */
        .liquid-glass {
            background: rgba(15, 23, 42, 0.4); /* Semi-transparent slate */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }

        /* Animation utilities */
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
        
        /* Card Hover Effect */
        .metric-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .metric-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="relative flex items-center justify-center py-10 px-4 sm:px-8">

    <!-- Ambient Background Blobs (Liquid effect enhancer) -->
    <div class="fixed inset-0 overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[10%] w-72 h-72 sm:w-96 sm:h-96 bg-purple-700/30 rounded-full mix-blend-screen filter blur-[100px] animate-blob"></div>
        <div class="absolute top-[20%] right-[10%] w-72 h-72 sm:w-96 sm:h-96 bg-cyan-700/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-10%] left-[30%] w-72 h-72 sm:w-96 sm:h-96 bg-pink-700/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-4000"></div>
    </div>

    <!-- Main Content -->
    <main class="w-full max-w-6xl">
        
        <!-- Header Section -->
        <header class="liquid-glass rounded-3xl p-6 sm:p-8 mb-8 flex flex-col sm:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-6">
                <!-- Avatar -->
                <div class="relative w-24 h-24 rounded-full overflow-hidden border border-white/20 shadow-[0_0_20px_rgba(255,255,255,0.05)]">
                    <img src="https://placehold.co/200x200/1e1e1e/ffffff?text=DV" alt="Delis Val" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white mb-2">Delis Val</h1>
                    <p class="text-sm font-medium text-slate-300 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                        Dashboard Oficial • Cumbia Dream
                    </p>
                </div>
            </div>
            
            <div class="text-right flex flex-col items-end">
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">Última Actualización</span>
                <span id="ui-fecha" class="text-sm font-medium text-white liquid-glass px-4 py-2 rounded-xl">--</span>
            </div>
        </header>

        <!-- Metrics Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <!-- 1. Spotify -->
            <article class="liquid-glass rounded-3xl p-7 relative overflow-hidden group metric-card">
                <div class="absolute -right-6 -bottom-6 text-brand-spotify opacity-5 text-9xl transform -rotate-12 transition-transform group-hover:scale-110 duration-500">
                    <i class="fa-brands fa-spotify"></i>
                </div>
                <div class="relative z-10">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-12 h-12 rounded-2xl liquid-glass flex items-center justify-center text-brand-spotify text-xl border border-brand-spotify/30">
                            <i class="fa-brands fa-spotify"></i>
                        </div>
                        <h2 class="text-white font-semibold tracking-wide">Spotify</h2>
                    </div>
                    
                    <div>
                        <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Reproducciones Totales</p>
                        <div class="text-4xl font-bold text-white mb-2" id="ui-spotify-reproducciones">--</div>
                    </div>
                </div>
            </article>

            <!-- 2. YouTube -->
            <article class="liquid-glass rounded-3xl p-7 relative overflow-hidden group metric-card">
                <div class="absolute -right-6 -bottom-6 text-brand-youtube opacity-5 text-9xl transform -rotate-12 transition-transform group-hover:scale-110 duration-500">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                <div class="relative z-10">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-12 h-12 rounded-2xl liquid-glass flex items-center justify-center text-brand-youtube text-xl border border-brand-youtube/30">
                            <i class="fa-brands fa-youtube"></i>
                        </div>
                        <h2 class="text-white font-semibold tracking-wide">YouTube</h2>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Suscriptores</p>
                            <div class="text-2xl font-bold text-white" id="ui-yt-subs">--</div>
                        </div>
                        <div>
                            <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Top Video (Views)</p>
                            <div class="text-2xl font-bold text-white" id="ui-yt-vistas">--</div>
                        </div>
                    </div>
                </div>
            </article>

            <!-- 3. Instagram -->
            <article class="liquid-glass rounded-3xl p-7 relative overflow-hidden group metric-card">
                <div class="absolute -right-6 -bottom-6 text-brand-instagram opacity-5 text-9xl transform -rotate-12 transition-transform group-hover:scale-110 duration-500">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="relative z-10">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-12 h-12 rounded-2xl liquid-glass flex items-center justify-center text-brand-instagram text-xl border border-brand-instagram/30">
                            <i class="fa-brands fa-instagram"></i>
                        </div>
                        <h2 class="text-white font-semibold tracking-wide">Instagram</h2>
                    </div>
                    
                    <div>
                        <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Seguidores</p>
                        <div class="text-4xl font-bold text-white mb-2" id="ui-ig-seguidores">--</div>
                    </div>
                </div>
            </article>

            <!-- 4. TikTok -->
            <article class="liquid-glass rounded-3xl p-7 relative overflow-hidden group metric-card">
                <div class="absolute -right-6 -bottom-6 text-brand-tiktok opacity-5 text-9xl transform -rotate-12 transition-transform group-hover:scale-110 duration-500">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <div class="relative z-10">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-12 h-12 rounded-2xl liquid-glass flex items-center justify-center text-white text-xl border border-brand-tiktok/40 shadow-[0_0_10px_rgba(0,242,254,0.2)]">
                            <i class="fa-brands fa-tiktok"></i>
                        </div>
                        <h2 class="text-white font-semibold tracking-wide">TikTok</h2>
                    </div>
                    
                    <div>
                        <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Seguidores</p>
                        <div class="text-4xl font-bold text-white mb-2" id="ui-tiktok-seguidores">--</div>
                    </div>
                </div>
            </article>

            <!-- 5. Chartmetric -->
            <article class="liquid-glass rounded-3xl p-7 relative overflow-hidden group metric-card md:col-span-2 lg:col-span-2 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6">
                <div class="absolute -right-10 -top-10 text-brand-chartmetric opacity-5 text-9xl transform rotate-12 transition-transform group-hover:scale-110 duration-500 pointer-events-none">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                
                <div class="relative z-10 flex-1">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-12 h-12 rounded-2xl liquid-glass flex items-center justify-center text-brand-chartmetric text-xl border border-brand-chartmetric/30">
                            <i class="fa-solid fa-chart-line"></i>
                        </div>
                        <h2 class="text-white font-semibold tracking-wide">Chartmetric</h2>
                    </div>
                    
                    <div>
                        <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Ranking Global</p>
                        <div class="text-4xl font-bold text-white" id="ui-cm-ranking">--</div>
                    </div>
                </div>

                <div class="relative z-10 w-full sm:w-auto">
                    <a id="ui-cm-url" href="#" target="_blank" rel="noopener noreferrer" class="glass-button w-full sm:w-auto inline-flex justify-center items-center gap-3 px-6 py-4 rounded-xl text-white font-semibold hover:text-brand-chartmetric transition-colors">
                        <span>Ver Perfil Completo</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
                    </a>
                </div>
            </article>

        </div>
    </main>

    <!-- ========================================== -->
    <!-- LÓGICA Y DATOS CONFIGURABLES (VIBE CODE) -->
    <!-- ========================================== -->
    <script>
        /**
         * ⚠️ ZONA DE EDICIÓN MANUAL ⚠️
         * Actualiza los números dentro de este bloque. 
         * Al guardar y refrescar Notion, el dashboard reflejará los cambios.
         * Asegúrate de escribir solo números sin puntos ni comas en los valores.
         */
        
        const DATOS_DELIS_VAL = {
            fechaActualizacion: "22 de Octubre, 2026",
            
            spotify: {
                reproducciones: 1540200
            },
            
            youtube: {
                suscriptores: 8520,
                vistasVideoMasVisto: 1250400
            },
            
            instagram: {
                seguidores: 15600
            },
            
            tiktok: {
                seguidores: 32400
            },
            
            chartmetric: {
                ranking: 14503,
                url: "https://chartmetric.com/artist/1136205"
            }
        };

        /* ---------------------------------------------------------
           MOTOR DE RENDERIZADO (No necesitas editar debajo de esto)
           --------------------------------------------------------- */
        
        document.addEventListener('DOMContentLoaded', () => {
            // Utilidad para formatear números con separadores de miles (ej. 1.000.000)
            const formatearNumero = (num) => {
                return new Intl.NumberFormat('es-CL').format(num);
            };

            // Inyectar Datos en la Interfaz
            try {
                // Fecha
                document.getElementById('ui-fecha').textContent = DATOS_DELIS_VAL.fechaActualizacion;

                // Spotify
                document.getElementById('ui-spotify-reproducciones').textContent = formatearNumero(DATOS_DELIS_VAL.spotify.reproducciones);
                
                // YouTube
                document.getElementById('ui-yt-subs').textContent = formatearNumero(DATOS_DELIS_VAL.youtube.suscriptores);
                document.getElementById('ui-yt-vistas').textContent = formatearNumero(DATOS_DELIS_VAL.youtube.vistasVideoMasVisto);
                
                // Instagram
                document.getElementById('ui-ig-seguidores').textContent = formatearNumero(DATOS_DELIS_VAL.instagram.seguidores);
                
                // TikTok
                document.getElementById('ui-tiktok-seguidores').textContent = formatearNumero(DATOS_DELIS_VAL.tiktok.seguidores);
                
                // Chartmetric
                document.getElementById('ui-cm-ranking').textContent = `#${formatearNumero(DATOS_DELIS_VAL.chartmetric.ranking)}`;
                document.getElementById('ui-cm-url').href = DATOS_DELIS_VAL.chartmetric.url;

            } catch (error) {
                console.error("Error al inyectar los datos en el DOM:", error);
            }
        });
    </script>
</body>
</html>
